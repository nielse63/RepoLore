services:
  - type: web
    name: repolore
    runtime: node
    plan: pro
    buildCommand: NODE_ENV=development npm install && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: GITHUB_TOKEN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SITE_URL
        value: https://repolore.app
