services:
  - type: web
    name: repolore
    runtime: node
    plan: pro
    buildCommand: NODE_ENV=development npm install && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    # Deploy main only after its checks pass, so the Release workflow's tag
    # exists before the build reads it for the footer version.
    autoDeployTrigger: checksPass
    envVars:
      - key: GITHUB_TOKEN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SITE_URL
        value: https://repolore.app
