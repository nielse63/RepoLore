name: Claude PR Review

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request for Repo Lore (Next.js App Router + TypeScript).
            Read CLAUDE.md at the repo root first for project context, scope, and
            architecture decisions (docs/architecture/decisions/) before reviewing.

            Focus on:
            - Correctness bugs and unhandled edge cases in the diff
            - Security issues (injection, auth, secret handling, unsafe input)
            - Scope creep relative to docs/product/mvp.md and non-goals.md
            - Missing or weak test coverage for changed code (see CLAUDE.md's
              testing conventions)

            The PR is already checked out in the working directory.
            Use `gh pr comment` for one top-level summary comment.
            Use `mcp__github_inline_comment__create_inline_comment` (with
            `confirmed: true`) for specific line-level issues.
            Only post GitHub comments — don't just print review text as a message.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
