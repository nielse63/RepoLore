name: Nightly dependency updates

on:
  schedule:
    - cron: "0 3 * * *"
      timezone: America/Detroit
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nightly-dependency-updates-dev
  cancel-in-progress: false

jobs:
  update:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: repolore
          POSTGRES_PASSWORD: repolore
          POSTGRES_DB: repolore
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10

    env:
      CI: "true"
      HUSKY: "0"

    steps:
      - name: Check out dev
        uses: actions/checkout@v7
        with:
          ref: dev
          fetch-depth: 0

      - name: Set up Node.js from .nvmrc
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: npm

      - name: Update dependency versions
        run: >-
          npx --yes npm-check-updates@latest --packageFile package.json --dep prod,dev --target latest --upgrade

      - name: Install dependencies and update lockfile
        run: npm install

      - name: Check for dependency changes
        id: changes
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No dependency changes."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Playwright browser
        if: steps.changes.outputs.changed == 'true'
        run: npx --no-install playwright install --with-deps chromium

      - name: Prepare test database
        if: steps.changes.outputs.changed == 'true'
        env:
          DATABASE_URL: postgres://repolore:repolore@localhost:5432/repolore
        run: |
          npm run migrate
          npm run seed:e2e

      - name: Build application
        if: steps.changes.outputs.changed == 'true'
        env:
          DATABASE_URL: postgres://repolore:repolore@localhost:5432/repolore
        run: npm run build

      - name: Verify updated dependencies
        if: steps.changes.outputs.changed == 'true'
        env:
          DATABASE_URL: postgres://repolore:repolore@localhost:5432/repolore
        run: npm run verify

      - name: Check formatting
        if: steps.changes.outputs.changed == 'true'
        run: npm run format:check

      - name: Ensure verification did not modify other tracked files
        if: steps.changes.outputs.changed == 'true'
        run: |
          git diff --exit-code -- . ':!package.json' ':!package-lock.json'

      - name: Commit and push dependency updates
        if: steps.changes.outputs.changed == 'true'
        run: |
          # Do not push results verified against an outdated dev branch.
          git fetch origin dev
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/dev)" ]; then
            echo "::error::dev changed during verification. Skipping push."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -- package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No dependency changes to commit."
            exit 0
          fi

          git commit -m "chore(deps): update npm dependencies"
          git push origin HEAD:refs/heads/dev
