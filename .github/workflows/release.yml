name: Release

# Patch-bumps the version (a new vX.Y.Z tag plus a GitHub release) whenever
# dev is merged into main. Render deploys main only once this check passes
# (`autoDeployTrigger: checksPass` in render.yaml), so the tag exists before
# the build reads it for the footer. Other pushes to main pass without
# releasing. After a release, main is merged back into dev so the new tag
# is reachable from dev. Minor/major/explicit versions: `npm run release`
# locally. nightly-release.yml opens and merges the dev → main PR nightly.
on:
  push:
    branches:
      - main

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Creates the tag and release, and pushes the main → dev merge; reads
    # which PR the commit came from.
    permissions:
      contents: write
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history, for the main → dev merge below.
          fetch-depth: 0

      - name: Check for a dev → main merge not yet tagged
        id: check
        run: |
          heads=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" \
            --jq '.[] | select(.base.ref == "main" and .merged_at != null) | .head.ref')
          if ! grep -qx dev <<<"$heads"; then
            echo "Not a dev → main merge; skipping."
            echo "release=false" >> "$GITHUB_OUTPUT"
          elif git ls-remote --tags --refs origin | grep -q "^${{ github.sha }}"; then
            echo "${{ github.sha }} is already tagged; skipping."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.check.outputs.release == 'true'
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
      - if: steps.check.outputs.release == 'true'
        run: npm ci
      - if: steps.check.outputs.release == 'true'
        run: npm run release -- --patch --target "${{ github.sha }}" --yes

      # Brings the tag into dev's history. Fails (leaving dev untouched) if
      # the merge conflicts, which only happens when dev changed the same
      # lines after this release's PR merged; resolve that merge by hand.
      - name: Merge main back into dev
        if: steps.check.outputs.release == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B dev origin/dev
          git merge --no-edit origin/main
          git push origin HEAD:dev
