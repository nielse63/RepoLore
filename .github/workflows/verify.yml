name: Verify

# No trigger-level `paths` filter: verify and e2e are required status checks,
# and a workflow skipped by `paths` never reports, leaving the PR waiting
# forever. The changes job decides instead; a job skipped by `if` counts as
# passing.
on:
  pull_request:
    branches:
      - main
      - dev

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - id: filter
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files=$(gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" \
            --paginate --jq '.[].filename')
          if grep -qE '^(src|public|fixtures|e2e|scripts)/|^(package\.json|package-lock\.json|next\.config\.ts|jest\.config\.ts|postcss\.config\.mjs|\.github/workflows/verify\.yml)$' <<<"$files"; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "No code changes; skipping verify and e2e."
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  verify:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    # DATABASE_URL is scoped to the steps that read it, not the job, so
    # package lifecycle scripts run by the install step never see it.
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history and tags, so the build's footer version (`git describe`) resolves.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
      - run: npm ci
      - run: npm run lint
      - run: npm run build
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - run: npm run test:unit:coverage
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: nielse63/RepoLore
      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: nielse63/RepoLore
          report_type: test_results
          files: ./test-results/junit.xml

  # Playwright against a throwaway Postgres seeded from local source
  # (`npm run seed:e2e`) — no GITHUB_TOKEN and no shared database.
  e2e:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: repolore
          POSTGRES_PASSWORD: repolore
          POSTGRES_DB: repolore
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://repolore:repolore@localhost:5432/repolore
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history and tags, so the build's footer version (`git describe`) resolves.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run migrate
      - run: npm run seed:e2e
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
