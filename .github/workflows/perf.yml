name: Performance

on:
  pull_request:
    branches:
      - main
      - dev
    paths:
      - "src/**"
      - "public/**"
      - "package.json"
      - "package-lock.json"
      - "next.config.ts"
      - "postcss.config.mjs"
      - "scripts/perf-vitals.ts"
      - ".github/workflows/perf.yml"

concurrency:
  group: perf-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Comments on the PR; nothing else needs write access.
    permissions:
      contents: read
      pull-requests: write
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
      - run: npm ci
      - run: npm run build
      - name: Start production server
        run: |
          npm run start > next-start.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://localhost:3000/api/health && exit 0
            sleep 1
          done
          cat next-start.log
          exit 1
      # Compares against https://repolore.app; uses the runner's preinstalled
      # Chrome. Fails only on Lighthouse/setup errors or a load that wasn't
      # cold and direct — metrics over tolerance are advisory (see below).
      - run: npm run test:perf
        env:
          PERF_PR_NUMBER: ${{ github.event.pull_request.number }}
          PERF_COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
      - name: Add report to job summary
        if: always()
        run: cat perf-report/report.md >> "$GITHUB_STEP_SUMMARY" || true
      # One sticky comment per PR, found by the marker on pr-comment.md's
      # first line: created on the first breach, then updated on every run
      # (to the all-clear once breaches clear). Skipped for fork PRs, whose
      # token can't comment.
      - name: Comment breaches on PR
        if: success() && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const { breaches } = JSON.parse(fs.readFileSync("perf-report/report.json", "utf8"));
            const body = fs.readFileSync("perf-report/pr-comment.md", "utf8");
            const marker = body.split("\n")[0];
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find((c) => c.user?.type === "Bot" && c.body?.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else if (breaches.length > 0) {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: perf-report
          path: |
            perf-report/
            next-start.log
          if-no-files-found: ignore
