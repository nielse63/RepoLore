services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: repolore
      POSTGRES_PASSWORD: repolore
      POSTGRES_DB: repolore
    ports:
      - "5432:5432"
    # 18+ images keep data in a major-version subdirectory of
    # /var/lib/postgresql, so the mount is the parent, not .../data.
    volumes:
      - repolore-db-data-18:/var/lib/postgresql

volumes:
  repolore-db-data-18:
